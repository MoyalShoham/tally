name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Benchmark
        if: matrix.python-version == '3.13'
        run: tally benchmark --seeds 7 11 42 2026 101 555 --out benchmark.md && cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
